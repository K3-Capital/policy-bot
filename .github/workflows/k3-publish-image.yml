# Builds the policy-bot image K3 Capital runs (this fork: the release v1.42.1 plus upstream pull request #1363) and publishes it
# to Amazon ECR, as
#   648832445185.dkr.ecr.eu-north-1.amazonaws.com/policy-bot:sha-<40-hex commit>
# (linux/amd64, which is what the Fargate task of infra-k3 production/policy-bot runs). The deployment is a change of the image
# reference in that stack, by digest: nothing is deployed from here.
#
# Runs for a push to the k3/stacked-prs branch only. The tests have to pass before anything is built for publication, and a
# sha-<commit> tag is never replaced (the ECR repository is immutable; a second run of the same commit only reports the digest).
#
# Security contract: `contents: read` + `id-token: write`, every action pinned to a full commit (tag in the comment). The
# registry credential is a short-lived AWS session from GitHub's OIDC token: the `publish` environment assumes the publish role
# (infra-k3, production/policy-bot), whose trust policy names this workflow file, this branch and that environment, and which
# can only push to that one repository. No credential is stored in the repository. Values a step needs are passed through
# `env:` and expanded quoted; no `${{ }}` expression is interpolated into a `run:` command line.
name: K3 publish image

on:
  push:
    branches: [k3/stacked-prs]

permissions:
  contents: read
  id-token: write # the OIDC token the AWS role is assumed with

env:
  ECR_REGISTRY: 648832445185.dkr.ecr.eu-north-1.amazonaws.com
  ECR_REPOSITORY: policy-bot

concurrency:
  group: k3-publish-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run the tests
        # The packages the change of #1363 touches, and the rest of the server.
        run: go test ./server/... ./policy/... ./pull/...

  publish:
    name: build and publish the image
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: publish # the AWS role only trusts jobs of this environment
    steps:
      - name: Check out the commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: 24

      - name: Build the frontend
        run: |
          set -euo pipefail
          yarn install --frozen-lockfile
          yarn run build:production
          test -f build/static/manifest.json

      - name: Build the binary
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          # The version the server reports (GET /api/validate, the logs): the upstream release it is based on and the commit.
          version="1.42.1-k3-${COMMIT:0:12}"
          mkdir -p build/image
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/palantir/policy-bot/version.version=${version}" \
            -o build/image/policy-bot .
          file build/image/policy-bot || true
          echo "version=${version}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the image
        run: docker build --platform linux/amd64 -f docker/Dockerfile.k3 -t policy-bot:publish .

      - name: Check the layout of the image
        # The server reads static/ and templates/ from its working directory at startup, so a wrong layout only shows when the
        # container starts. This is the same layout as the official image.
        run: |
          set -euo pipefail
          cid="$(docker create policy-bot:publish)"
          docker export "$cid" | tar -t > /tmp/files.txt
          docker rm "$cid" >/dev/null
          for expected in \
            policy-bot/bin/linux-amd64/policy-bot \
            policy-bot/templates/page.html.tmpl \
            policy-bot/templates/details.html.tmpl \
            policy-bot/static/manifest.json \
            secrets/policy-bot.yml \
            etc/ssl/certs/ca-certificates.crt \
            etc/mime.types; do
            grep -q -x "$expected" /tmp/files.txt || { echo "missing from the image: $expected" >&2; exit 1; }
          done
          [[ "$(docker image inspect policy-bot:publish --format '{{.Config.WorkingDir}}')" == "/policy-bot" ]]
          docker run --rm policy-bot:publish --help >/dev/null

      - name: Assume the publish role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: k3-publish-image-${{ github.run_id }}

      - name: Push the image
        env:
          COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "not a commit sha: $COMMIT" >&2; exit 1; }
          tag="sha-${COMMIT}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$ECR_REGISTRY"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=${tag}" >/dev/null 2>&1; then
            echo "${tag} is already in the registry: not pushing it again"
          else
            docker tag policy-bot:publish "${ECR_REGISTRY}/${ECR_REPOSITORY}:${tag}"
            docker push "${ECR_REGISTRY}/${ECR_REPOSITORY}:${tag}"
          fi
          digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=${tag}" --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest for ${tag}: $digest" >&2; exit 1; }
          {
            echo "### Published"
            echo ""
            echo "- tag: \`${tag}\`"
            echo "- reference for infra-k3: \`${ECR_REGISTRY}/${ECR_REPOSITORY}@${digest}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "${ECR_REGISTRY}/${ECR_REPOSITORY}@${digest}"
